name: Check

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    timeout-minutes: 15
    types: [published]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack
      - name: Run the packed CLI through npx
        shell: bash
        run: npm exec --yes --package ./codex-model-sync-*.tgz -- codex-model-sync --version
      - name: Run the public release through npx
        if: github.event_name == 'release'
        shell: bash
        env:
          PACKAGE_URL: ${{ github.event.release.assets[0].browser_download_url }}
        run: npm exec --yes "--package=$PACKAGE_URL" -- codex-model-sync --version
      - name: Run the published npm package through npx
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || 'latest' }}
        run: npx --yes "codex-model-sync@${RELEASE_TAG#v}" --version
